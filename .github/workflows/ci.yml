name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        env:
          FROM_SHA: ${{ github.event.pull_request.base.sha }}
          TO_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$FROM_SHA" --to "$TO_SHA" --verbose

      - name: Lint pushed commit
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

  unit-test:
    name: Unit/Integration (Node ${{ matrix.node-version }}, Nest ${{ matrix.nest-major }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.19, 22.x, 24.x, 26.x]
        nest-major: [10, 11]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Align NestJS major version
        run: >
          pnpm add -D
          @nestjs/common@^${{ matrix.nest-major }}.0.0
          @nestjs/core@^${{ matrix.nest-major }}.0.0
          @nestjs/platform-express@^${{ matrix.nest-major }}.0.0
          @nestjs/testing@^${{ matrix.nest-major }}.0.0

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
